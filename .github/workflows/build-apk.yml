name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ScanPDF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScanPDF-apk
          path: ScanPDF.apk

      - name: Publish Release (unduh langsung tanpa login)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScanPDF.apk \
            --title "ScanPDF (versi terbaru)" \
            --notes "Unduh ScanPDF.apk di bawah lalu instal di Android."
